name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: rust-report

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Check for code issues
        run: cargo +stable clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo +stable test --locked